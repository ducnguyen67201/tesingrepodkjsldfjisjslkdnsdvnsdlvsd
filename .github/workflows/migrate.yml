name: Database Migration

on:
  push:
    branches:
      - main
      - stage
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations'
        required: true
        default: 'Production'
        type: choice
        options:
          - Production
          - Staging

jobs:
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || ((github.ref_name == 'prod' || github.ref_name == 'main') && 'Production' || 'Staging') }}

    steps:
      - name: Debug environment
        run: |
          echo "Environment: ${{ inputs.environment || ((github.ref_name == 'prod' || github.ref_name == 'main') && 'Production' || 'Staging') }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "DATABASE_URL is set: ${{ vars.DATABASE_URL != '' }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @ducsigr/db db:migrate:deploy
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
