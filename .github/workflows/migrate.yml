name: Database Migration

on:
  push:
    branches:
      - main

jobs:
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve failed migrations
        working-directory: packages/db
        run: |
          # Mark any failed migrations as rolled back
          npx prisma migrate resolve --rolled-back 20251220211117_init_otlp_schema --schema prisma/schema || true
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}

      - name: Run database migrations
        run: pnpm --filter @ducsigr/db db:migrate:deploy
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
