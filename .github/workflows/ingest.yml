name: Ingest

on:
  workflow_call:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate:ci

      - name: Build (includes dependencies)
        run: pnpm turbo run build --filter=@ducsigr/ingest-node

      - name: Type check
        run: pnpm turbo run typecheck --filter=@ducsigr/ingest-node

      - name: Test
        run: pnpm turbo run test --filter=@ducsigr/ingest-node

      - name: Lint
        run: pnpm --filter @ducsigr/ingest-node lint

      - name: Check for uncommitted changes (drift check)
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Uncommitted changes detected after build. Please commit all generated files."
            git status --porcelain
            git diff
            exit 1
          fi
