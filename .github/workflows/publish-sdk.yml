name: Publish SDK

on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: Staging  # Use Staging environment to access NPM_TOKEN
    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @ducsigr/sdk typecheck

      - name: Build
        run: pnpm --filter @ducsigr/sdk build
        env:
          DUCSIGR_DEFAULT_ENDPOINT: ${{ secrets.DUCSIGR_DEFAULT_ENDPOINT }}

      - name: Test
        run: pnpm --filter @ducsigr/sdk test:run

      - name: Lint
        run: pnpm --filter @ducsigr/sdk lint

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#sdk-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Verify package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Package version ($PACKAGE_VERSION) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Publish to npm with provenance
        run: pnpm --filter @ducsigr/sdk publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
