name: Web

on:
  workflow_call:

jobs:
  ci:
    name: Type Check → Test → Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognobserve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cognobserve_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cognobserve_shadow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate:ci

      - name: Create shadow database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE cognobserve_shadow;"

      - name: Run migrations
        run: pnpm --filter @cognobserve/db db:migrate:deploy

      # Schema Drift Detection using Shadow Database
      - name: Check migration drift (migrations vs schema)
        run: |
          echo "Checking if migrations match the Prisma schema..."
          cd packages/db && pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema \
            --exit-code
        continue-on-error: false

      - name: Check database drift (database vs migrations)
        run: |
          echo "Checking if database state matches applied migrations..."
          cd packages/db && pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-migrations ./prisma/migrations \
            --exit-code
        continue-on-error: false

      - name: Validate no pending migrations needed
        run: |
          echo "Checking if any new migrations are needed..."
          cd packages/db
          # Use shadow database to simulate migration creation
          # If this produces output, a migration is needed
          OUTPUT=$(pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema \
            --script 2>&1) || true

          if [ -n "$OUTPUT" ] && [ "$OUTPUT" != "-- This is an empty migration." ]; then
            echo "::error::Schema drift detected! The following migration is needed:"
            echo "$OUTPUT"
            echo ""
            echo "Run 'pnpm db:migrate --name <descriptive_name>' to create the migration."
            exit 1
          fi
          echo "✓ No pending migrations needed"

      - name: Type check
        run: pnpm --filter @cognobserve/web --filter @cognobserve/api typecheck

      - name: Test
        run: pnpm --filter @cognobserve/web --filter @cognobserve/api test

      - name: Lint
        run: pnpm --filter @cognobserve/web --filter @cognobserve/api lint

      - name: Build
        run: pnpm --filter @cognobserve/web build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Check for uncommitted changes (drift check)
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Uncommitted changes detected after build. Please commit all generated files."
            git status --porcelain
            git diff
            exit 1
          fi
