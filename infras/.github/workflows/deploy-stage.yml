name: Deploy to Stage

on:
  push:
    branches:
      - stage
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NAMESPACE: stage
  DOPPLER_PROJECT: ducsigr
  DOPPLER_CONFIG: stage

jobs:
  deploy:
    name: Deploy to Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Get K3s Node Instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=*stage-server-0*" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Deploy via SSM
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGE }}
        run: |
          # Create deployment script
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e

          # Install Doppler if not present
          if ! command -v doppler &> /dev/null; then
            curl -sLf --retry 3 --tlsv1.2 --proto "=https" 'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] https://packages.doppler.com/public/cli/deb/debian any-version main" | sudo tee /etc/apt/sources.list.d/doppler-cli.list
            sudo apt-get update && sudo apt-get install -y doppler
          fi

          # Clone/update infra repo
          cd /tmp
          rm -rf ducsigr-infras
          git clone https://github.com/ducnguyen67201/ducsigr-infras.git
          cd ducsigr-infras

          # Deploy using Doppler
          export DOPPLER_TOKEN="${DOPPLER_TOKEN}"
          export NAMESPACE="stage"
          export IMAGE_TAG="${IMAGE_TAG:-latest}"
          export WEB_REPLICAS=1
          export INGEST_REPLICAS=1
          export WORKER_REPLICAS=1

          # Apply manifests
          for manifest in k8s/base/*.yaml; do
            echo "Applying $manifest..."
            doppler run --project ducsigr --config stage -- sh -c "envsubst < $manifest" | sudo k3s kubectl apply -f -
          done

          # Wait for rollouts
          sudo k3s kubectl rollout status deployment/web -n stage --timeout=300s || true
          sudo k3s kubectl rollout status deployment/ingest -n stage --timeout=300s || true
          sudo k3s kubectl rollout status deployment/worker -n stage --timeout=300s || true

          echo "Deployment complete!"
          sudo k3s kubectl get pods -n stage
          DEPLOY_SCRIPT

          # Send script to node via SSM
          aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"export DOPPLER_TOKEN='$DOPPLER_TOKEN' && export IMAGE_TAG='${{ github.sha }}' && $(cat /tmp/deploy.sh | base64 -w0 | xargs -I {} echo 'echo {} | base64 -d | bash')\"]" \
            --output text

      - name: Wait for deployment
        run: |
          # Wait for SSM command to complete
          sleep 30

          # Verify deployment
          COMMAND_ID=$(aws ssm list-commands \
            --instance-id "${{ steps.get-instance.outputs.instance_id }}" \
            --query 'Commands[0].CommandId' \
            --output text)

          aws ssm get-command-invocation \
            --instance-id "${{ steps.get-instance.outputs.instance_id }}" \
            --command-id "$COMMAND_ID" \
            --query 'StandardOutputContent' \
            --output text || echo "Check SSM console for details"
